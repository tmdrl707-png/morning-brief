name: tts

# news/*.json 또는 weekly/*.json 이 main 에 올라오면 Gemini API 로 음성(mp3)을 만들어
# 'audio' 브랜치(항상 최신 1개 커밋, 기록 누적 없음)에 올린다.
on:
  push:
    branches: [main]
    paths:
      - "news/*.json"
      - "weekly/*.json"
  workflow_dispatch:
    inputs:
      file:
        description: "음성으로 만들 json 경로 (예: news/2026-11-18.json)"
        required: true

concurrency:
  group: tts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 대상 파일 찾기
        id: f
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            F="${{ github.event.inputs.file }}"
          else
            F=$(git show --name-only --pretty=format: HEAD -- news weekly | grep '\.json$' | tail -1)
          fi
          echo "file=$F" >> "$GITHUB_OUTPUT"
          B=$(basename "$F" .json)
          case "$F" in weekly/*) B="weekly-$B";; esac
          echo "name=$B" >> "$GITHUB_OUTPUT"
          echo "대상: $F -> $B.mp3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 음성 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE }}
        run: |
          mkdir -p pub
          OUT="pub/${{ steps.f.outputs.name }}.mp3"
          if python3 scripts/gemini_tts.py "${{ steps.f.outputs.file }}" "$OUT" 2>&1 | tee pub/log.txt; then
            echo ok
          else
            echo "실패" > "pub/${{ steps.f.outputs.name }}.failed"
          fi
          rm -f "$OUT.txt"

      - name: audio 브랜치에 게시
        run: |
          cd pub
          git init -q -b audio
          git config user.name "tts-bot"
          git config user.email "tts-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "audio ${{ steps.f.outputs.name }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin audio
