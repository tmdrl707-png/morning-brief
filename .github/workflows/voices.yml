name: voices

# voices/ 아래 파일이 바뀌어 main 에 올라오면 목소리 시안을 만들어 'voices' 브랜치에 올린다.
on:
  push:
    branches: [main]
    paths:
      - "voices/**"

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: 목소리별 시안 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p pub
          for v in $(cat voices/list.txt); do
            echo "== $v"
            GEMINI_VOICE=$v python3 scripts/gemini_tts.py voices/sample.json "pub/voice-$v.mp3" 2>&1 | tail -3 || true
            rm -f "pub/voice-$v.mp3.txt" "pub/voice-$v.mp3.meta"
          done
          ls -la pub
      - name: voices 브랜치에 게시
        run: |
          cd pub
          git init -q -b voices
          git config user.name "tts-bot"
          git config user.email "tts-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "voice samples"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin voices
